version: '3.8'

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    ports:
      - "8080:8080"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:8090/v1
      - WEBUI_SECRET_KEY=your-secret-key-change-me
      - OLLAMA_API_BASE_URL=http://host.docker.internal:8090
      - API_BASE_URL=http://host.docker.internal:8090/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./open-webui-data:/app/backend/data
    restart: unless-stopped